<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 48" width="60" height="48">
  <!-- Card shadow/border -->
  <rect x="2" y="2" width="56" height="44" rx="2" ry="2" fill="#e0e0e0"/>
  <!-- Card white body -->
  <rect x="1" y="1" width="55" height="43" rx="2" ry="2" fill="white" stroke="#c0c0c0" stroke-width="0.8"/>

  <!-- Green top bar -->
  <rect x="1" y="1" width="55" height="9" rx="2" ry="2" fill="#2bba5a"/>
  <!-- fix bottom corners of green bar -->
  <rect x="1" y="6" width="55" height="4" fill="#2bba5a"/>

  <!-- Three white wave lines inside green bar -->
  <path d="M5,4 Q18,2 30,4 Q42,6 55,4" fill="none" stroke="white" stroke-width="0.8" opacity="0.7"/>
  <path d="M5,6 Q18,4 30,6 Q42,8 55,6" fill="none" stroke="white" stroke-width="0.8" opacity="0.5"/>
  <path d="M5,8 Q18,6 30,8 Q42,10 55,8" fill="none" stroke="white" stroke-width="0.8" opacity="0.3"/>

  <!-- Photo placeholder box (left) -->
  <rect x="5" y="14" width="16" height="19" rx="1" fill="#e8e8e8" stroke="#ccc" stroke-width="0.6"/>
  <!-- Person silhouette in photo box -->
  <circle cx="13" cy="19" r="3.5" fill="#aaa"/>
  <path d="M6,33 Q13,26 20,33" fill="#aaa"/>

  <!-- Horizontal info lines (right of photo) -->
  <rect x="25" y="14" width="28" height="2.2" rx="1" fill="#999"/>
  <rect x="25" y="19" width="22" height="2.2" rx="1" fill="#bbb"/>
  <rect x="25" y="24" width="25" height="2.2" rx="1" fill="#bbb"/>

  <!-- Bottom full-width line -->
  <rect x="5" y="36" width="48" height="2" rx="1" fill="#ccc"/>
  <rect x="5" y="40" width="30" height="1.5" rx="1" fill="#ddd"/>
</svg>
