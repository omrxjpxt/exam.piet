<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 370" width="300" height="370">
  <defs>
    <!-- Clip to rounded rect for the main green body -->
    <clipPath id="bodyClip">
      <rect x="10" y="30" width="280" height="330" rx="14" ry="14"/>
    </clipPath>
    <!-- Curved arc for bottom text -->
    <path id="bottomArc" d="M 30,330 Q 150,370 270,330"/>
  </defs>

  <!-- ── Green shield body ── -->
  <rect x="10" y="30" width="280" height="330" rx="14" ry="14" fill="#1da84a"/>

  <!-- ── Wave lines at top (white) ── -->
  <!-- Five wave lines stacked, clipped to body -->
  <g clip-path="url(#bodyClip)" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round">
    <path d="M 10,38  Q 75,8  150,28  Q 225,48 290,28"/>
    <path d="M 10,50  Q 75,20 150,40  Q 225,60 290,40"/>
    <path d="M 10,62  Q 75,32 150,52  Q 225,72 290,52"/>
    <path d="M 10,74  Q 75,44 150,64  Q 225,84 290,64"/>
    <path d="M 10,86  Q 75,56 150,76  Q 225,96 290,76"/>
  </g>

  <!-- ── White oval ── -->
  <ellipse cx="150" cy="160" rx="115" ry="62" fill="white" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ── VP letters (blue) inside oval ── -->
  <!-- V -->
  <text x="102" y="178"
        font-family="Arial Black, Helvetica, sans-serif"
        font-size="72"
        font-weight="900"
        fill="#1a4dbf"
        letter-spacing="-6">V</text>
  <!-- P overlapping -->
  <text x="172" y="178"
        font-family="Arial Black, Helvetica, sans-serif"
        font-size="72"
        font-weight="900"
        fill="#1a4dbf">P</text>

  <!-- ── VIDHYAPEETH EDUCATION TRUST curved text ── -->
  <text x="150" y="234"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="11.5"
        font-weight="600"
        fill="#1a4dbf"
        letter-spacing="0.5">• VIDHYAPEETH EDUCATION TRUST •</text>

  <!-- ── P.I.E.T. in yellow ── -->
  <text x="150" y="298"
        text-anchor="middle"
        font-family="Arial Black, Helvetica, sans-serif"
        font-size="60"
        font-weight="900"
        fill="#f5e800"
        letter-spacing="2">P.I.E.T.</text>

  <!-- ── Curved bottom text ── -->
  <path id="curveBottom" d="M 42,335 Q 150,372 258,335" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="0.6">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">
      PANIPAT INSTITUTE OF ENGINEERING &amp; TECHNOLOGY
    </textPath>
  </text>
</svg>
